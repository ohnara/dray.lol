<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dray.lol</title>

<link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<!-- INTRO OVERLAY -->
<div id="popup">
  <p class="enter">click to enter</p>
  <button id="button"></button>
</div>

<!-- BACKGROUND -->
<img id="bk" src="MP4/charon walk.gif">
<div id="noise"></div>

<!-- MAIN CONTENT -->
<div id="main" class="hidden">

  <h1 id="username">dray</h1>

  <div class="icons">
    <a href="https://twitch.tv/draylovesher">
      <img src="MP4/twitch.png">
    </a>

    <a href="https://www.youtube.com/channel/UC4lhw3QR5vXOnVIb4soDxJA">
      <img src="MP4/youtube.png">
    </a>
  </div>

</div>

<!-- AUDIO -->
<audio id="audio" loop>
  <source src="MP4/eem.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById('button');
const popup = document.getElementById('popup');
const audio = document.getElementById('audio');
const main = document.getElementById('main');

btn.addEventListener('click', () => {
  audio.play(); // mobile-safe
  popup.style.opacity = '0';

  setTimeout(() => {
    popup.style.display = 'none';
    main.classList.remove('hidden');
    main.classList.add('fade-in');
  }, 500);
});
</script>

</body>
</html>
